bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /go2/odom
    transform_tolerance: 0.5
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /go2/odom
    controller_plugins: [FollowPath]
    goal_checker_plugin: goal_checker
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.22
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: -0.20
      max_vel_x: 0.35
      max_vel_y: 0.20
      max_vel_theta: 0.60
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 0.50
      acc_lim_y: 0.40
      acc_lim_theta: 0.80
      decel_lim_x: -0.70
      decel_lim_y: -0.60
      decel_lim_theta: -1.00
      vx_samples: 16
      vy_samples: 9
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.50
      xy_goal_tolerance: 0.22
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.03
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.35
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.35
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Foxy declares these two parameters as integers.
      width: 5
      height: 5
      resolution: 0.05
      # Conservative commissioning hull; measure the actual standing stance.
      footprint: "[[0.42,0.28],[0.42,-0.28],[-0.42,-0.28],[-0.42,0.28]]"
      footprint_padding: 0.03
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: go2_lidar
        go2_lidar:
          # Host-clock-normalized by sensor_time_bridge.
          topic: /go2/lidar/cloud_base
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.22
          max_obstacle_height: 0.50
          obstacle_range: 4.0
          raytrace_range: 5.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.32
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.42,0.28],[0.42,-0.28],[-0.42,-0.28],[-0.42,0.28]]"
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: go2_lidar
        go2_lidar:
          # Host-clock-normalized by sensor_time_bridge.
          topic: /go2/lidar/cloud_base
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: -0.22
          max_obstacle_height: 0.50
          obstacle_range: 4.0
          raytrace_range: 5.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 4.0
        inflation_radius: 0.32
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.30
      use_astar: true
      allow_unknown: false

recoveries_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    recovery_plugins: [spin, wait]
    spin:
      plugin: nav2_recoveries/Spin
    wait:
      plugin: nav2_recoveries/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.5
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.45
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [controller_server, planner_server, recoveries_server, bt_navigator, waypoint_follower]
