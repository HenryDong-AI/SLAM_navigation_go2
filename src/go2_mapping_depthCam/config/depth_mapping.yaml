depth_camera_bridge:
  ros__parameters:
    # Leave empty to select the first RealSense. The installed D435i was
    # detected as serial 250122076106 during setup.
    serial_number: ""
    # Intel's accuracy-oriented D435i profile. It delivered many more usable
    # fused frames than 1280x720 on the Go2 while retaining native depth detail.
    width: 848
    height: 480
    fps: 15
    # Capture at the native 15 Hz profile but publish only the newest frame at
    # the mapper's 5 Hz processing rate. This avoids wasting DDS bandwidth on
    # frames the mapper cannot fuse.
    publish_rate_hz: 5.0
    # The D435i on this device can remain enumerated while its stream stalls.
    # Because this bridge exclusively owns it, reset only that USB camera and
    # restart capture when no frames arrive.
    no_frame_timeout_sec: 3.0
    auto_hardware_reset: true
    hardware_reset_wait_sec: 5.0
    frame_id: d435i_color_optical_frame
    color_topic: /go2/depth_camera/color/image_raw
    depth_topic: /go2/depth_camera/aligned_depth/image_raw
    color_info_topic: /go2/depth_camera/color/camera_info
    depth_info_topic: /go2/depth_camera/aligned_depth/camera_info
    status_topic: /go2/depth_camera/status
    # Atomic mapping input: aligned XYZ and RGB share one DDS sample, so a
    # delayed executor can never retain mismatched image timestamps.
    pointcloud_topic: /go2/depth_camera/points
    pointcloud_pixel_stride: 2
    pointcloud_min_depth: 0.25
    pointcloud_max_depth: 3.0
    pointcloud_max_points: 60000

go2_mapping_depthcam:
  ros__parameters:
    camera_cloud_topic: /go2/depth_camera/points
    odom_topic: /go2/odom
    time_sync_topic: /go2/time_sync/status
    map_cloud_topic: /go2/map/cloud
    map_topic: /map
    mapping_status_topic: /go2/mapping/status
    world_frame: odom
    base_frame: base_link
    expected_camera_frame: d435i_color_optical_frame
    time_sync_required: true

    # Measured on this Go2 by registering 30 stationary D435i depth/LiDAR
    # pairs on 2026-08-28. Validation: 0.0438 m nearest-surface RMSE and
    # 96.5% overlap. This is T_base_link_from_d435i_color_optical_frame.
    extrinsics_confirmed: true
    base_from_camera_optical:
      [0.02872632, -0.16499669, 0.98587570, 0.41930855,
       -0.99949750, -0.01796270, 0.02611698, 0.04548966,
       0.01339977, -0.98613054, -0.16542978, 0.09202389,
       0.0, 0.0, 0.0, 1.0]

    processing_rate_hz: 5.0
    # The bridge already bounds/deprojects each atomic cloud. This second cap
    # rejects malformed or unexpectedly large external PointCloud2 samples.
    max_camera_points: 60000
    max_camera_age_sec: 0.50
    max_odom_delta_sec: 0.15
    odom_buffer_size: 100

    # Correct moving depth scans against a short recent RGB-D submap before
    # voxel fusion. This is deliberately map-only: /go2/odom, the robot TF,
    # Nav2, and the motion gate are never modified by registration.
    registration_enabled: true
    registration_rate_hz: 2.0
    registration_voxel_size: 0.06
    registration_submap_frames: 5
    registration_max_source_points: 5000
    registration_max_target_points: 12000
    registration_max_correspondence: 0.14
    registration_iterations: 8
    registration_trim_fraction: 0.75
    registration_min_correspondences: 250
    registration_min_overlap: 0.35
    registration_max_rmse: 0.07
    registration_max_translation: 0.10
    registration_max_rotation_deg: 4.0
    registration_gain: 0.60
    registration_min_motion_translation: 0.015
    registration_min_motion_rotation_deg: 0.50
    # A rejected scan is fused with guarded Go2 odometry. After this many
    # consecutive failures, replace only the short ICP target submap with the
    # current scan so registration cannot remain locked to an old location.
    registration_reseed_after_rejections: 3

    # Keep the requested 4 cm final map grid. Registration, not smaller
    # voxels, addresses duplicated/smeared object surfaces.
    voxel_size: 0.04
    min_point_range: 0.20
    max_point_range: 5.0
    min_relative_z: -0.50
    max_relative_z: 2.00
    max_voxels: 600000
    retention_radius: 0.0

    grid_resolution: 0.10
    obstacle_min_height: -0.22
    obstacle_max_height: 0.50
    hit_log_odds: 0.85
    miss_log_odds: -0.40
    min_log_odds: -2.0
    max_log_odds: 3.5
    max_grid_cells: 500000
    max_rays_per_update: 4000
    max_ray_cells: 4096
    max_dense_grid_cells: 4000000

    # Timers only request work. Full-map serialization/publication and
    # autosave are coalesced on a dedicated output worker.
    publish_rate_hz: 1.0
    output_directory: /home/unitree/SLAM_nav/maps_depth_camera
    load_state_path: ""
    auto_save_period_sec: 60.0
    save_free_threshold: 25
    save_occupied_threshold: 65

rgbd_viewer:
  ros__parameters:
    color_topic: /go2/depth_camera/color/image_raw
    depth_topic: /go2/depth_camera/aligned_depth/image_raw
    window_name: "Go2 D435i RGB | RGB-D"
    max_visual_depth: 3.0
